_schema-version: 3.3.0
ID: fioifullstack
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: fioifullstack-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: fioifullstack-auth
      - name: fioifullstack-db
      - name: fioifullstack-destination

  - name: fioifullstack-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: fioifullstack-db
  - name: fioifullstack
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: fioifullstack-auth
      - name: fioifullstack-destination
      - name: fioifullstack-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: fioifullstack-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: fioifullstackproject1
          artifacts:
            - project1.zip
          target-path: app/
    requires:
      - name: fioifullstack-auth
      - name: srv-api
      - name: fioifullstack-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: fioifullstackproject1
    type: html5
    path: app/project1
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: fioifullstack-destinations
    type: com.sap.application.content
    requires:
      - name: fioifullstack-auth
        parameters:
          service-key:
            name: fioifullstack-auth-key
      - name: fioifullstack-html5-repo-host
        parameters:
          service-key:
            name: fioifullstack-html5-repo-host-key
      - name: srv-api
      - name: fioifullstack-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: fioifullstack-html5-repository
              ServiceInstanceName: fioifullstack-html5-repo-host
              ServiceKeyName: fioifullstack-html5-repo-host-key
              sap.cloud.service: fioifullstack.service
            - Name: fioifullstack-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: fioifullstack-auth
              ServiceKeyName: fioifullstack-auth-key
              sap.cloud.service: fioifullstack.service

resources:
  - name: fioifullstack-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: fioifullstack-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: fioifullstack-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: fioifullstack-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: fioifullstack-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: fioifullstack-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
